name: Generate visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual:update
      - name: Upload Linux visual baselines for review
        uses: actions/upload-artifact@v4
        with:
          name: linux-chromium-visual-baselines
          path: tests/e2e/snapshots/visual.spec.ts/
          if-no-files-found: error
          retention-days: 7
